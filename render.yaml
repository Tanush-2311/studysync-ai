services:
  - type: web
    name: studysync-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://tanush-2311.github.io
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
